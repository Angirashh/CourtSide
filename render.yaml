# Render Blueprint: deploys the FastAPI backend from the `main` branch.
# The frontend is deployed separately on Vercel (see frontend/vercel.json).
services:
  - type: web
    name: courtside-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    branch: main
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
    plan: starter # use "free" to try it out; it sleeps when idle, so upgrade before a live tournament
    healthCheckPath: /health
    envVars:
      # Supabase Postgres connection string (transaction pooler, port 6543). Enter it in the dashboard.
      - key: DATABASE_URL
        sync: false
      # Generated once by Render, unique to production.
      - key: JWT_SECRET_KEY
        generateValue: true
      # JSON list of allowed browser origins, e.g. ["https://your-app.vercel.app"]
      - key: CORS_ORIGINS
        sync: false
      - key: DEBUG
        value: "false"
