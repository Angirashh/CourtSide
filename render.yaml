# Render Blueprint: deploys the FastAPI backend from the `main` branch.
# The frontend is deployed separately on Vercel (see frontend/vercel.json).
services:
  - type: web
    name: courtside-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    branch: main
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
    plan: free # sleeps after 15 min idle; upgrade to "starter" before a live tournament to keep it always-on
    healthCheckPath: /health
    envVars:
      # Supabase Postgres connection string (transaction pooler, port 6543). Enter it in the dashboard.
      - key: DATABASE_URL
        sync: false
      # Generated once by Render, unique to production.
      - key: JWT_SECRET_KEY
        generateValue: true
      # JSON list of allowed browser origins, e.g. ["https://your-app.vercel.app"]
      - key: CORS_ORIGINS
        sync: false
      - key: DEBUG
        value: "false"
      # Sentry project DSN (https://sentry.io) -- enter it in the dashboard. Left unset, error
      # tracking simply stays off (see app/main.py), so this is optional but recommended.
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: "production"
      # Session-mode Postgres URL (Supabase Supavisor pooler, port 5432) for live score push --
      # enter it in the dashboard. Left unset, spectators fall back to polling only.
      - key: LISTEN_DATABASE_URL
        sync: false
